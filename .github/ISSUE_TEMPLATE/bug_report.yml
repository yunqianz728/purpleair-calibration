name: Bug report
description: Report a reproducible problem in the application or code.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private data and API keys from all examples.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the selected workflow, column mapping, and a minimal de-identified example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Public app or local OS, Python version, and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
