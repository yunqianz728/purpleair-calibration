name: Feature request
description: Suggest an improvement with a clear research or user need.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Research or user need
      description: Describe the problem and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the desired behavior and any scientific assumptions.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation considerations
      description: Describe data, tests, or reference observations needed to evaluate the change.
