name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application and test dependencies
        run: python -m pip install -r app/requirements.txt pytest

      - name: Run calibration integration checks
        run: python app/test_calibration.py

      - name: Run repository and interface tests
        run: python -m pytest -q tests

      - name: Compile maintained Python modules
        run: >-
          python -m py_compile
          app/app.py
          app/train_deployment_models.py
          app/utils/feature_engineering.py
          app/utils/model_predictor.py
